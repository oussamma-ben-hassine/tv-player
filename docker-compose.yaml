version: '3.8'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tvplayer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tv_secure_postgres_pass_2026
    volumes:
      - tv-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tvplayer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:tv_secure_postgres_pass_2026@db:5432/tvplayer?schema=public"
      PORT: 3000
      NODE_ENV: production
      APP_URL: "https://tv.oussamma.tn"
      SSO_BASE_URL: "https://sso-a.oussamma.tn"
      SSO_CLIENT_ID: "client_tv_app"
      SSO_CLIENT_SECRET: "sec_tv_platform_secret_2026"
      SSO_REDIRECT_URI: "https://tv.oussamma.tn/auth/callback"
      SSO_SCOPES: "openid profile email"
      ADMIN_EMAILS: "oussammabenhassine@gmail.com"
      SESSION_SECRET: "tv-player-super-session-secret-2026-prod"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.tv-redirect-ssl.redirectscheme.scheme=https"
      - "traefik.http.routers.tv-http.entrypoints=http"
      - "traefik.http.routers.tv-http.rule=Host(`tv.oussamma.tn`)"
      - "traefik.http.routers.tv-http.middlewares=tv-redirect-ssl"
      - "traefik.http.routers.tv-https.entrypoints=https"
      - "traefik.http.routers.tv-https.rule=Host(`tv.oussamma.tn`)"
      - "traefik.http.routers.tv-https.tls=true"
      - "traefik.http.routers.tv-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tv-https.service=tv-service"
      - "traefik.http.services.tv-service.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
    networks:
      - default
      - coolify

volumes:
  tv-db-data:

networks:
  default:
  coolify:
    external: true
